- aid: lever:lever-webhooks-api
  name: Lever Webhooks API
  tags:
  - Webhooks
  - Events
  properties:
  - url: https://hire.lever.co/developer/documentation#webhooks
    type: Documentation
  description: >-
    Subscribe to Lever events (applicationCreated, candidateHired, stageChange, contactUpdate). Events
    are signed with HMAC-SHA256 for receiver verification.
- aid: lever:lever-postings-public-api
  name: Lever Postings Public API
  tags:
  - Postings
  - Public
  - Jobs
  properties:
