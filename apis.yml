aid: lever
url: https://raw.githubusercontent.com/api-evangelist/lever/refs/heads/main/apis.yml
name: Lever
kind: company
description: Lever is a talent acquisition and applicant tracking platform built on
  the Opportunities data model. The Lever API exposes candidates, opportunities, postings,
  interviews, feedback, requisitions, users, files, webhooks, and a public Postings
  API for embedding job sites.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/lever.png
tags:
- HR
- ATS
- Recruiting
- Talent Acquisition
- SaaS
created: '2026-05-08'
modified: '2026-05-19'
specificationVersion: '0.23'
apis:
- aid: lever:lever-candidates-api
  name: Lever Candidates API
  tags:
  - Candidates
  - Legacy
  properties:
  - url: https://hire.lever.co/developer/documentation#candidates
    type: Documentation
  description: >-
    Legacy Candidates endpoints maintained for backward compatibility. New integrations should use Opportunities;
    Candidates remain available for historical record retrieval.
- aid: lever:lever-contacts-api
  name: Lever Contacts API
  tags:
  - Contacts
  - People
  properties:
  - url: https://hire.lever.co/developer/documentation#contacts
    type: Documentation
  description: >-
    Contacts represent unique people across multiple opportunities, allowing Lever to deduplicate candidates
    who apply to multiple roles.
- aid: lever:lever-postings-api
  name: Lever Postings API
  tags:
  - Postings
  - Jobs
  - Public
  properties:
  - url: https://hire.lever.co/developer/documentation#postings
    type: Documentation
  - url: https://github.com/lever/postings-api
    type: SDKs
  description: >-
    Manage job postings programmatically and power custom public job sites. The Postings API has a public
    read-only mode that does not require authentication for displaying job listings.
- aid: lever:lever-applications-api
  name: Lever Applications API
  tags:
  - Applications
  - Submissions
  properties:
  - url: https://hire.lever.co/developer/documentation#applications
    type: Documentation
  description: >-
    Submit candidate applications against postings, including resumes, cover letters, and EEO survey data,
    and retrieve historical application records.
- aid: lever:lever-stages-api
  name: Lever Stages API
  tags:
  - Stages
  - Pipeline
  properties:
  - url: https://hire.lever.co/developer/documentation#stages
    type: Documentation
  description: >-
    List the configured pipeline stages and disposition stages used to route opportunities through screening,
    interviews, offer, and hire.
- aid: lever:lever-archive-reasons-api
  name: Lever Archive Reasons API
  tags:
  - Archive Reasons
  - Disposition
  properties:
  - url: https://hire.lever.co/developer/documentation#archive-reasons
    type: Documentation
  description: >-
    Read archive reasons used when an opportunity is archived (rejected, hired, withdrawn) for downstream
    EEO and analytics reporting.
- aid: lever:lever-interviews-api
  name: Lever Interviews API
  tags:
  - Interviews
  - Panels
  - Scheduling
  properties:
  - url: https://hire.lever.co/developer/documentation#interviews
    type: Documentation
  description: >-
    Read interview events, panels, and schedules associated with an opportunity, including interviewer
    assignments and time slots.
- aid: lever:lever-feedback-api
  name: Lever Feedback API
  tags:
  - Feedback
  - Scorecards
  properties:
  - url: https://hire.lever.co/developer/documentation#feedback
    type: Documentation
  description: >-
    Read feedback forms and scorecards completed by interviewers and hiring managers, with templated and
    free-form fields.
- aid: lever:lever-feedback-templates-api
  name: Lever Feedback Templates API
  tags:
  - Feedback Templates
  - Forms
  properties:
  - url: https://hire.lever.co/developer/documentation#feedback-templates
    type: Documentation
  description: >-
    Manage feedback form templates, including question definitions and scoring rubrics applied across
    postings and stages.
- aid: lever:lever-notes-api
  name: Lever Notes API
  tags:
  - Notes
  properties:
  - url: https://hire.lever.co/developer/documentation#notes
    type: Documentation
  description: >-
    Add and retrieve free-form notes attached to opportunities for recruiter and hiring manager collaboration.
- aid: lever:lever-offers-api
  name: Lever Offers API
  tags:
  - Offers
  - Approvals
  properties:
  - url: https://hire.lever.co/developer/documentation#offers
    type: Documentation
  description: >-
    Read offer records associated with opportunities, including offer letters, approval status, and compensation
    breakdowns.
- aid: lever:lever-requisitions-api
  name: Lever Requisitions API
  tags:
  - Requisitions
  - Headcount
  properties:
  - url: https://hire.lever.co/developer/documentation#requisitions
    type: Documentation
  description: >-
    Manage requisitions backing each posting — headcount, compensation bands, and approval state — typically
    synced from an HRIS.
