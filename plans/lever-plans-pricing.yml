description: >-
  Lever sells LeverTRM (Talent Relationship Management) bundles on a
  custom-quoted basis. Public pricing is intentionally not displayed; tiers
  scale by company size, hiring volume, and feature add-ons (Nurture,
  Analytics, Automation, Advanced Reports). Plans below capture the
  product bundles as published by Lever.
sources:
  - https://www.lever.co/pricing/
notes: >-
  Lever publishes no list prices. Engage Lever sales (888-885-5299) for a
  current quote. Replace placeholder prices with negotiated amounts after
  the deal closes.
