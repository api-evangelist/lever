naftiko: 1.0.0-alpha2
info:
  label: Lever API — EEO
  description: 'Lever API — EEO. 2 operations. Lead operation: List anonymous EEO responses. Self-contained Naftiko capability
    covering one Lever business surface.'
  tags:
  - Lever
  - EEO
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LEVER_API_KEY: LEVER_API_KEY
capability:
  consumes:
  - type: http
    namespace: lever-eeo
    baseUri: https://api.lever.co/v1
    description: Lever API — EEO business capability. Self-contained, no shared references.
    resources:
    - name: eeo-responses
      path: /eeo/responses
      operations:
      - name: get
        method: GET
        description: List anonymous EEO responses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: eeo-responses-pii
      path: /eeo/responses/pii
      operations:
      - name: get
        method: GET
        description: List EEO responses with PII
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LEVER_API_KEY}}'
  exposes:
  - type: rest
    namespace: lever-eeo-rest
    port: 8080
    description: REST adapter for Lever API — EEO. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/eeo/responses
      name: eeo-responses
      description: REST surface for eeo-responses.
      operations:
      - method: GET
        name: get
        description: List anonymous EEO responses
        call: lever-eeo.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/eeo/responses/pii
      name: eeo-responses-pii
      description: REST surface for eeo-responses-pii.
      operations:
      - method: GET
        name: get
        description: List EEO responses with PII
        call: lever-eeo.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lever-eeo-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lever API — EEO. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-anonymous-eeo-responses
      description: List anonymous EEO responses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lever-eeo.get
      outputParameters:
      - type: object
        mapping: $.
    - name: list-eeo-responses-pii
      description: List EEO responses with PII
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lever-eeo.get
      outputParameters:
      - type: object
        mapping: $.
