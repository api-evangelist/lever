    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: get
        description: List users
        call: lever-users.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Create user
        call: lever-users.post
        with:
