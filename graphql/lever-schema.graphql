"""
Lever ATS Conceptual GraphQL Schema
Source: https://hire.lever.co/developer/documentation
GitHub: https://github.com/lever
Type: Conceptual REST-to-GraphQL translation
"""

# ---------------------------------------------------------------------------
# Scalars and Enums
# ---------------------------------------------------------------------------

scalar DateTime
scalar JSON
scalar Upload

enum OpportunityState {
  ACTIVE
  ARCHIVED
  HIRED
}

enum PostingState {
  PUBLISHED
  CLOSED
  DRAFT
  PENDING
  REJECTED
  DELETED
}

enum WorkType {
  FULL_TIME
  PART_TIME
  CONTRACT
  INTERNSHIP
  TEMPORARY
}

enum OfferStatus {
  DRAFT
  APPROVAL_SENT
  APPROVED
  SENT
  OPENED
  SIGNED
  DECLINED
  WITHDRAWN
}

enum UserRole {
  SUPER_ADMIN
  ADMIN
  TEAM_MEMBER
  LIMITED_TEAM_MEMBER
  INTERVIEWER
  OUTSIDER
}

enum RequisitionStatus {
  OPEN
  APPROVED
  CLOSED
  CANCELED
}

enum ConsentStatus {
  PENDING
  GRANTED
  DENIED
  EXPIRED
}

enum WebhookStatus {
  ACTIVE
  INACTIVE
}

enum FeedbackDecision {
  STRONG_YES
  YES
  NO
  STRONG_NO
}

enum NoteVisibility {
  INTERNAL
  EXTERNAL
}

enum EEOGender {
  MALE
  FEMALE
  NON_BINARY
  PREFER_NOT_TO_SAY
}

enum EEORace {
  AMERICAN_INDIAN
  ASIAN
  BLACK
  HISPANIC
  NATIVE_HAWAIIAN
  WHITE
  TWO_OR_MORE
  PREFER_NOT_TO_SAY
}

# ---------------------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------------------

type PageInfo {
  hasNextPage: Boolean!
  nextCursor: String
  total: Int
}

# ---------------------------------------------------------------------------
# Organization and Platform
# ---------------------------------------------------------------------------

"""Lever tenant/account configuration."""
type Organization {
  id: ID!
  name: String!
  domain: String
  logoUrl: String
  timezone: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""OAuth 2.0 client application registered with Lever."""
type OAuthClient {
  id: ID!
  name: String!
  clientId: String!
  redirectUris: [String!]!
  scopes: [String!]!
  createdAt: DateTime!
}

"""API key or OAuth token used to authenticate API requests."""
type APIToken {
  id: ID!
  name: String!
  createdAt: DateTime!
  expiresAt: DateTime
  scopes: [String!]!
  user: User
}

"""Tenant-scoped audit log entry for security monitoring and SOC reporting."""
type AuditEvent {
  id: ID!
  eventType: String!
  actorId: ID
  actor: User
  targetId: ID
  targetType: String
  description: String
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
}

# ---------------------------------------------------------------------------
# Users and People
# ---------------------------------------------------------------------------

"""Lever platform user with role-based access control."""
type User {
  id: ID!
  name: String!
  email: String!
  username: String
  role: UserRole!
  accessRole: String
  isDeleted: Boolean!
  externalDirectoryId: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Unique person record that deduplicates candidates across multiple Opportunities."""
type Contact {
  id: ID!
  name: String!
  headline: String
  location: String
  emails: [ContactEmail!]!
  phones: [ContactPhone!]!
  links: [String!]!
  tags: [String!]!
  sources: [String!]!
  opportunities: [Opportunity!]!
  dataProtection: DataProtection
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Email address associated with a Contact."""
type ContactEmail {
  id: ID!
  value: String!
  type: String
  isPrimary: Boolean!
}

"""Phone number associated with a Contact."""
type ContactPhone {
  id: ID!
  value: String!
  type: String
  isPrimary: Boolean!
}

"""User designated as Hiring Manager on an Opportunity or Posting."""
type HiringManager {
  id: ID!
  user: User!
  postingId: ID
  opportunityId: ID
}

"""Collection of Users assigned roles on an Opportunity."""
type HiringTeam {
  opportunityId: ID!
  hiringManagers: [User!]!
  recruiters: [User!]!
  coordinators: [User!]!
  sourcers: [User!]!
}

# ---------------------------------------------------------------------------
# Organization Structure
# ---------------------------------------------------------------------------

"""Organizational department grouping Postings and Requisitions."""
type Department {
  id: ID!
  name: String!
  parentId: ID
  parent: Department
  children: [Department!]!
  postings: [Posting!]!
  createdAt: DateTime!
}

"""Sub-group within a Department for finer-grained reporting."""
type Team {
  id: ID!
  name: String!
  department: Department
  members: [User!]!
  createdAt: DateTime!
}

# ---------------------------------------------------------------------------
# Pipeline
# ---------------------------------------------------------------------------

"""Configured stage definition in a Lever account's hiring pipeline."""
type PipelineStage {
  id: ID!
  text: String!
  type: String
  """The order index of this stage in the pipeline."""
  index: Int!
}

"""Named hiring pipeline configuration."""
type Pipeline {
  id: ID!
  name: String!
  stages: [PipelineStage!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Current stage of an Opportunity in the pipeline."""
type Stage {
  id: ID!
  text: String!
}

# ---------------------------------------------------------------------------
# Archive
# ---------------------------------------------------------------------------

"""Reason code for archiving an Opportunity."""
type ArchiveReason {
  id: ID!
  text: String!
  status: String!
  type: String
}

"""Record of an Opportunity being removed from the active pipeline."""
type Archive {
  id: ID!
  opportunity: Opportunity!
  reason: ArchiveReason!
  archivedBy: User
  archivedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Tags and Sources
# ---------------------------------------------------------------------------

"""Label applied to Opportunities for cohorting and analytics."""
type Tag {
  id: ID!
  text: String!
  count: Int
}

"""Attribution source for how a candidate entered the pipeline."""
type Source {
  id: ID!
  text: String!
  type: String
}

"""Full attribution record linking Source and channel to an Opportunity."""
type Attribution {
  id: ID!
  opportunity: Opportunity!
  source: Source
  channel: String
  referrer: User
  postingId: ID
  createdAt: DateTime!
}

# ---------------------------------------------------------------------------
# Postings and Jobs
# ---------------------------------------------------------------------------

"""Location attached to a Posting."""
type JobLocation {
  id: ID!
  text: String!
  city: String
  state: String
  country: String
  isRemote: Boolean!
  postalCode: String
}

"""Work type classification for a Posting."""
type JobWorkType {
  id: ID!
  text: String!
  value: WorkType!
}

"""Shareable anonymous link for a Posting that does not expose candidate identity."""
type AnonymousLink {
  id: ID!
  posting: Posting!
  url: String!
  expiresAt: DateTime
  createdAt: DateTime!
}

"""Employee referral submission form attached to a Posting."""
type ReferralForm {
  id: ID!
  posting: Posting!
  fields: [FormField!]!
  createdAt: DateTime!
}

"""Application form attached to a Posting with custom fields."""
type PostingForm {
  id: ID!
  posting: Posting!
  fields: [FormField!]!
  eeoEnabled: Boolean!
  createdAt: DateTime!
}

"""A single field definition within a form."""
type FormField {
  id: ID!
  text: String!
  type: String!
  required: Boolean!
  options: [String!]
  description: String
}

"""Job listing managed through Lever."""
type Posting {
  id: ID!
  text: String!
  state: PostingState!
  department: Department
  team: Team
  location: JobLocation
  workType: JobWorkType
  distributionChannels: [String!]!
  reqCode: String
  requisition: Requisition
  hiringManager: User
  urls: PostingUrls
  categories: PostingCategories
  content: PostingContent
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  publishedAt: DateTime
  form: PostingForm
  referralForm: ReferralForm
  anonymousLinks: [AnonymousLink!]!
  applications: [Application!]!
  opportunities: [Opportunity!]!
}

type PostingUrls {
  list: String
  show: String
  apply: String
}

type PostingCategories {
  commitment: String
  department: String
  location: String
  team: String
  allLocations: [String!]
}

type PostingContent {
  description: String
  descriptionHtml: String
  lists: [PostingContentSection!]!
  closing: String
  closingHtml: String
}

type PostingContentSection {
  text: String!
  content: String
}

# ---------------------------------------------------------------------------
# Requisitions
# ---------------------------------------------------------------------------

"""Headcount request backing a Posting, with compensation bands and approval state."""
type Requisition {
  id: ID!
  name: String!
  reqCode: String
  status: RequisitionStatus!
  headcountTotal: Int
  headcountHired: Int
  headcountRemaining: Int
  internalJobCode: String
  compensationBandLow: Float
  compensationBandHigh: Float
  compensationCurrency: String
  compensationInterval: String
  department: Department
  team: Team
  hiringManagers: [User!]!
  posting: Posting
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Opportunities and Applications
# ---------------------------------------------------------------------------

"""Formal submission of a candidate against a Posting."""
type Application {
  id: ID!
  opportunity: Opportunity!
  posting: Posting!
  type: String
  candidateName: String
  email: String
  phone: String
  resume: Resume
  formFields: [ApplicationFormField!]!
  eeoData: EEOData
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ApplicationFormField {
  id: ID!
  text: String!
  value: JSON
}

"""A candidate's public application submission through a Posting's form."""
type PostingApplication {
  id: ID!
  posting: Posting!
  candidateName: String!
  email: String!
  phone: String
  resume: Upload
  formFields: [ApplicationFormField!]!
  createdAt: DateTime!
}

"""Parsed resume data including work history, education, and skills."""
type Resume {
  id: ID!
  opportunityId: ID!
  fileId: ID
  fileName: String
  parsedData: ResumedParsedData
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ResumedParsedData {
  positions: [ResumePosition!]!
  schools: [ResumeSchool!]!
  skills: [String!]!
  summary: String
}

type ResumePosition {
  org: String
  title: String
  summary: String
  start: ResumeDate
  end: ResumeDate
  isCurrent: Boolean
}

type ResumeSchool {
  org: String
  degree: String
  field: String
  start: ResumeDate
  end: ResumeDate
}

type ResumeDate {
  year: Int
  month: Int
}

"""Central candidate-in-pipeline record."""
type Opportunity {
  id: ID!
  name: String!
  headline: String
  contact: Contact
  emails: [String!]!
  phones: [String!]!
  links: [String!]!
  tags: [String!]!
  sources: [String!]!
  origin: String
  sourcedBy: User
  owner: User
  stage: Stage
  stageChanges: [StageChange!]!
  location: String
  posting: Posting
  applications: [Application!]!
  resume: Resume
  interviews: [InterviewPanel!]!
  feedback: [InterviewFeedback!]!
  offers: [Offer!]!
  notes: [InternalNote!]!
  followers: [User!]!
  hiringManager: User
  requisition: Requisition
  state: OpportunityState!
  archive: Archive
  attributions: [Attribution!]!
  dataProtection: DataProtection
  isAnonymized: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  snoozedUntil: DateTime
}

type StageChange {
  toStageId: ID!
  toStage: Stage
  userId: ID
  user: User
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Interviews and Feedback
# ---------------------------------------------------------------------------

"""A scheduled interview panel tied to an Opportunity."""
type InterviewPanel {
  id: ID!
  opportunity: Opportunity!
  posting: Posting!
  stage: Stage
  subject: String
  note: String
  interviews: [Interview!]!
  feedbackTemplate: FeedbackTemplate
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Single interview event within a Panel."""
type Interview {
  id: ID!
  panel: InterviewPanel!
  subject: String
  note: String
  interviewers: [Interviewer!]!
  feedbackTemplate: FeedbackTemplate
  location: String
  phone: String
  duration: Int
  date: DateTime
  timezone: String
  canceledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Interviewer {
  user: User!
  feedbackToken: FeedbackToken
}

"""Grouping of interviewers assigned to an interview event."""
type Panel {
  id: ID!
  interview: Interview!
  interviewers: [User!]!
}

"""Feedback record submitted by an interviewer."""
type InterviewFeedback {
  id: ID!
  opportunity: Opportunity!
  interview: Interview
  panel: InterviewPanel
  author: User!
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  fields: [FeedbackField!]!
  decision: FeedbackDecision
}

type FeedbackField {
  id: ID!
  text: String!
  type: String!
  value: JSON
}

"""Structured scorecard with scored dimensions and overall recommendation."""
type Scorecard {
  id: ID!
  feedback: InterviewFeedback!
  dimensions: [ScorecardDimension!]!
  decision: FeedbackDecision
  notes: String
}

type ScorecardDimension {
  id: ID!
  text: String!
  score: Int
  note: String
}

"""Template defining questions and scoring rubrics for a stage or posting."""
type FeedbackTemplate {
  id: ID!
  text: String!
  instructions: String
  fields: [FormField!]!
  postings: [Posting!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Time-limited token allowing an interviewer to submit feedback without a Lever login."""
type FeedbackToken {
  id: ID!
  interview: Interview!
  user: User!
  token: String!
  expiresAt: DateTime!
  createdAt: DateTime!
}

# ---------------------------------------------------------------------------
# Notes
# ---------------------------------------------------------------------------

"""Private note on an Opportunity visible only to hiring team members."""
type InternalNote {
  id: ID!
  opportunity: Opportunity!
  author: User!
  body: String!
  visibility: NoteVisibility!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Note on an Opportunity that can be shared externally."""
type ExternalNote {
  id: ID!
  opportunity: Opportunity!
  author: User!
  body: String!
  sharedWith: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Offers
# ---------------------------------------------------------------------------

"""Offer record attached to an Opportunity."""
type Offer {
  id: ID!
  opportunity: Opportunity!
  status: OfferStatus!
  creator: User!
  sentAt: DateTime
  signedAt: DateTime
  expiresAt: DateTime
  currentVersion: OfferVersion
  versions: [OfferVersion!]!
  approvalChain: [OfferApproval!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Versioned snapshot of an Offer."""
type OfferVersion {
  id: ID!
  offer: Offer!
  versionNumber: Int!
  fields: [OfferField!]!
  sentTo: String
  createdAt: DateTime!
}

type OfferField {
  identifier: String!
  text: String!
  value: JSON
  currency: String
  interval: String
}

"""Individual approval step in an Offer approval chain."""
type OfferApproval {
  id: ID!
  offer: Offer!
  approver: User!
  approvedAt: DateTime
  declinedAt: DateTime
  comment: String
  order: Int!
}

# ---------------------------------------------------------------------------
# Surveys and Compliance
# ---------------------------------------------------------------------------

"""Record of a survey being sent to a candidate."""
type SurveySend {
  id: ID!
  opportunity: Opportunity!
  surveyType: String!
  sentAt: DateTime!
  completedAt: DateTime
  response: SurveyResponse
}

"""Candidate's response to a survey."""
type SurveyResponse {
  id: ID!
  surveySend: SurveySend!
  answers: [SurveyAnswer!]!
  completedAt: DateTime!
}

type SurveyAnswer {
  question: SurveyQuestion!
  value: JSON
}

"""Individual question within a survey."""
type SurveyQuestion {
  id: ID!
  text: String!
  type: String!
  required: Boolean!
  options: [String!]
}

"""GDPR/data protection settings for a Contact or Opportunity."""
type DataProtection {
  id: ID!
  contactId: ID!
  store: DataProtectionConsent
  send: DataProtectionConsent
}

type DataProtectionConsent {
  status: ConsentStatus!
  expiresAt: DateTime
  reason: String
}

"""Consent request sent to a candidate for data processing."""
type ConsentRequest {
  id: ID!
  contact: Contact!
  opportunity: Opportunity
  sentAt: DateTime!
  respondedAt: DateTime
  status: ConsentStatus!
  expiresAt: DateTime
  purpose: String
}

"""Anonymous EEO survey data for compliance reporting."""
type EEOData {
  id: ID!
  opportunityId: ID!
  gender: EEOGender
  race: EEORace
  veteran: Boolean
  disability: Boolean
}

# ---------------------------------------------------------------------------
