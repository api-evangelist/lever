# ---------------------------------------------------------------------------
# Root Types
# ---------------------------------------------------------------------------

type Query {
  """Fetch a single Opportunity by ID."""
  opportunity(id: ID!): Opportunity

  """Paginated list of Opportunities with optional filtering."""
  opportunities(filter: OpportunityFilter, limit: Int, cursor: String): OpportunityConnection!

  """Fetch a Contact by ID."""
  contact(id: ID!): Contact

  """Paginated list of Contacts."""
  contacts(filter: ContactFilter, limit: Int, cursor: String): ContactConnection!

  """Fetch a Posting by ID. Supports unauthenticated access for public postings."""
  posting(id: ID!): Posting

  """Paginated list of Postings."""
  postings(filter: PostingFilter, limit: Int, cursor: String): PostingConnection!

  """Fetch a Stage definition by ID."""
  stage(id: ID!): Stage

  """List all configured pipeline stages."""
  stages: [PipelineStage!]!

  """List all archive reason codes."""
  archiveReasons: [ArchiveReason!]!

  """Fetch a User by ID."""
  user(id: ID!): User

  """Paginated list of Users."""
  users(filter: UserFilter, limit: Int, cursor: String): UserConnection!

  """Fetch a Requisition by ID."""
  requisition(id: ID!): Requisition

  """Paginated list of Requisitions."""
  requisitions(filter: RequisitionFilter, limit: Int, cursor: String): RequisitionConnection!

  """Fetch an Interview by ID."""
  interview(id: ID!): Interview

  """List all Interview Panels for an Opportunity."""
  interviews(opportunityId: ID!): [InterviewPanel!]!

  """Fetch an Offer by ID."""
  offer(id: ID!): Offer

  """List Offers for an Opportunity."""
  offers(opportunityId: ID!): [Offer!]!

  """Fetch feedback records for an Opportunity."""
  feedback(opportunityId: ID!): [InterviewFeedback!]!

  """Fetch all registered Webhook subscriptions."""
  webhooks: [Webhook!]!

  """Paginated list of Audit Events."""
  auditEvents(filter: AuditEventFilter, limit: Int, cursor: String): AuditEventConnection!

  """List all Departments."""
  departments: [Department!]!

  """List all Tags in use across the account."""
  tags: [Tag!]!

  """List all Sources configured for the account."""
  sources: [Source!]!

  """Fetch the current Organization/tenant configuration."""
  organization: Organization

  """List Applications for an Opportunity."""
  applications(opportunityId: ID!): ApplicationConnection!

  """Fetch EEO data for an Opportunity."""
  eeoData(opportunityId: ID!): EEOData

  """List available Feedback Templates."""
  feedbackTemplates: [FeedbackTemplate!]!

  """XML feed entries for job aggregator syndication."""
  xmlFeedEntries(limit: Int, cursor: String): [XMLFeedEntry!]!
}

type Mutation {
  """Create a new Opportunity."""
  createOpportunity(input: CreateOpportunityInput!): Opportunity!

  """Update an existing Opportunity."""
  updateOpportunity(id: ID!, input: UpdateOpportunityInput!): Opportunity!

  """Archive an Opportunity with a reason."""
  archiveOpportunity(id: ID!, reasonId: ID!): Opportunity!

  """Move an Opportunity to a new pipeline stage."""
  advanceOpportunity(id: ID!, stageId: ID!): Opportunity!

  """Add a note to an Opportunity."""
  createNote(opportunityId: ID!, input: CreateNoteInput!): InternalNote!

  """Create a new Posting."""
  createPosting(input: CreatePostingInput!): Posting!

  """Update an existing Posting."""
  updatePosting(id: ID!, input: UpdatePostingInput!): Posting!

  """Submit a candidate application."""
  createApplication(input: CreateApplicationInput!): Application!

  """Create an Offer for an Opportunity."""
  createOffer(opportunityId: ID!, input: CreateOfferInput!): Offer!

  """Approve an Offer in the approval chain."""
  approveOffer(offerId: ID!): Offer!

  """Withdraw an Offer."""
  withdrawOffer(offerId: ID!): Offer!

  """Create a Requisition."""
  createRequisition(input: CreateRequisitionInput!): Requisition!

  """Register a Webhook subscription."""
  createWebhook(input: CreateWebhookInput!): Webhook!

  """Delete a Webhook subscription."""
  deleteWebhook(id: ID!): Boolean!

  """Invite a new User to the Lever account."""
  createUser(input: CreateUserInput!): User!

  """Update a User's role or details."""
  updateUser(id: ID!, input: UpdateUserInput!): User!

  """Add a tag to an Opportunity."""
  addTagToOpportunity(opportunityId: ID!, tag: String!): Opportunity!

  """Remove a tag from an Opportunity."""
  removeTagFromOpportunity(opportunityId: ID!, tag: String!): Opportunity!

  """Add a follower to an Opportunity."""
  addFollower(opportunityId: ID!, userId: ID!): Opportunity!

  """Remove a follower from an Opportunity."""
  removeFollower(opportunityId: ID!, userId: ID!): Opportunity!

  """Send a consent request to a candidate."""
  createConsentRequest(contactId: ID!, opportunityId: ID, purpose: String): ConsentRequest!
}
