}

type PostingConnection {
  nodes: [Posting!]!
  pageInfo: PageInfo!
}

type UserConnection {
  nodes: [User!]!
  pageInfo: PageInfo!
}

type RequisitionConnection {
  nodes: [Requisition!]!
  pageInfo: PageInfo!
}

type AuditEventConnection {
  nodes: [AuditEvent!]!
  pageInfo: PageInfo!
}

