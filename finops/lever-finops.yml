principles:
  - name: Visibility
    description: >-
      Pull annual Lever invoices and renewal quotes; reconcile against
      configured user count and active integrations.
  - name: Allocation
    description: >-
      Allocate Lever cost to recruiting / talent functions; tag by
      department or cost center via the Recruiting cost center.
  - name: Optimization
    description: >-
      Audit unused add-ons before renewal; consolidate user counts and
      negotiate volume discounts based on hiring forecast.
  - name: Accountability
    description: >-
      Designate Talent Operations as the contract owner; review quarterly
      against the master service agreement.
